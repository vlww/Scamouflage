<!doctype html>
<!-- Landscape architecture diagram (docs/banners/architecture.png), rendered by render-visuals.mjs. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Russo One'; src: url(../../node_modules/@fontsource/russo-one/files/russo-one-latin-400-normal.woff2) format('woff2'); }
html, body { margin: 0; background: #11140d; }
body { width: max-content; padding: 36px 40px 36px; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #f6f1dc; }
.kicker { font-size: 24px; font-weight: 700; letter-spacing: 2.5px; color: #b5c98a; text-transform: uppercase; }
h1 { font-family: 'Russo One', sans-serif; font-weight: 400; font-size: 60px; margin: 8px 0 28px; }
#out svg { max-width: none !important; }
</style></head>
<body>
<div class="kicker" id="k">Firebase AI Logic hybrid inference</div>
<h1 id="t">How a message gets checked</h1>
<script>
  // ?bare=1: diagram only (no heading), for the Devpost gallery.
  if (new URLSearchParams(location.search).get('bare')) { document.getElementById('k').hidden = true; document.getElementById('t').hidden = true; }
</script>
<div id="out"></div>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  flowchart: { curve: 'basis', nodeSpacing: 30, rankSpacing: 40, padding: 14, wrappingWidth: 300 },
  themeVariables: {
    fontFamily: '-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif',
    fontSize: '24px',
    background: '#11140d',
    primaryColor: '#1f2717', primaryTextColor: '#f6f1dc', primaryBorderColor: '#4b5a33',
    lineColor: '#8f9a74', edgeLabelBackground: '#11140d', tertiaryColor: '#11140d',
  },
});
const def = `
flowchart LR
  IN["📨 Gmail email<br/>📋 Text · 🖼️ Screenshot<br/>(cleaned & shrunk)"]:::input
  RECON["⚡ Quick rules, ~1 ms<br/>look-alike links, gift cards,<br/>pressure tactics"]:::local
  Q{"Gemini Nano<br/>ready?"}:::decide
  DEV["🔒 ON YOUR COMPUTER<br/>ONLY_ON_DEVICE<br/>full text never leaves"]:::device
  RED["🛡️ Personal details<br/>removed first"]:::redact
  CLOUD["☁️ CLOUD<br/>gemini-3.5-flash-lite"]:::cloud
  UI["🛡️ Side panel<br/>+ Gmail badge"]:::ui
  MORE["💬 Debrief chat<br/>🔁 Second opinion"]:::cloud
  FAM[("👪 Family<br/>summary only")]:::store
  IN --> RECON --> UI
  IN --> Q
  Q -- yes --> DEV
  Q -- "no" --> RED --> CLOUD
  Q -. "private mode:<br/>quick rules only" .-> UI
  DEV -. "still loading:<br/>cloud backup races it" .-> CLOUD
  DEV -- "streams" --> UI
  CLOUD -- "streams" --> UI
  UI -- "redacted" --> MORE
  UI --> FAM
  classDef input fill:#232a1b,stroke:#8f9a74,color:#f6f1dc
  classDef local fill:#1f2717,stroke:#4b5a33,color:#ece5cb
  classDef decide fill:#2c3520,stroke:#b5c98a,color:#f6f1dc
  classDef device fill:#173a1c,stroke:#7fd18a,color:#e6f8e3,stroke-width:2.5px
  classDef redact fill:#3b2f12,stroke:#e3b55a,color:#fbefd2,stroke-width:2px
  classDef cloud fill:#16283a,stroke:#7fb2e3,color:#e3f0fb,stroke-width:2px
  classDef ui fill:#2e3a1e,stroke:#b5c98a,color:#f6f1dc,stroke-width:2.5px
  classDef store fill:#2a2232,stroke:#b39ad6,color:#efe6fa
`;
const { svg } = await mermaid.render('arch', def);
document.getElementById('out').innerHTML = svg;
const el = document.querySelector('#out svg');
el.style.width = `${el.viewBox.baseVal.width}px`; // natural size: no scaling down
el.removeAttribute('height');
document.body.dataset.ready = '1';
</script>
</body></html>
